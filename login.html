<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Purity Tickets - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem 1rem;
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.25rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            background: white;
        }
        @media (max-width: 576px) {
            .login-card {
                padding: 1.75rem 1.25rem;
            }
            .form-control {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <div class="rounded p-1 d-inline-flex justify-content-center align-items-center mb-2" style="width: 48px; height: 48px;">
                 <img src="images/Picture1.png" alt="Logo" style="width: 48px; height: 48px; object-fit: contain;">
            </div>
            <h4 class="fw-bold">Data Purity Register</h4>
            <p class="text-muted small">Sign in to access the registry</p>
        </div>

        <div id="errorAlert" class="alert alert-danger d-none small" role="alert"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-semibold small">Username</label>
                <input type="text" class="form-control bg-light" id="username" required autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold small">Password</label>
                <input type="password" class="form-control bg-light" id="password" required autocomplete="current-password">
            </div>
            
            <!-- Math CAPTCHA -->
            <div class="mb-4">
                <label class="form-label fw-semibold small">Security Check: <span id="captchaQuestion" class="text-primary fw-bold"></span></label>
                <input type="number" class="form-control bg-light" id="captchaAnswer" placeholder="Enter the answer" required>
            </div>

            <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold" id="loginBtn">
                Sign In <i class="bi bi-box-arrow-in-right ms-2"></i>
            </button>
        </form>
    </div>

    <script>
        // Check for session timeout or redirect if user is already authenticated
        function checkExistingSession() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('timeout') === 'true') {
                sessionStorage.removeItem('ops_portal_token');
                sessionStorage.removeItem('ops_portal_user');
                sessionStorage.removeItem('ops_portal_records_cache');
                const errorAlert = document.getElementById('errorAlert');
                if (errorAlert) {
                    errorAlert.innerText = "Your session has expired. Please sign in again.";
                    errorAlert.classList.remove('d-none');
                }
                return;
            }

            // If already logged in, do not show login page — redirect forward to app immediately
            if (sessionStorage.getItem('ops_portal_token')) {
                window.location.replace('/index');
            }
        }

        // Run on load and whenever restored from back/forward cache
        checkExistingSession();
        window.addEventListener('pageshow', checkExistingSession);

        // 1. Generate Math CAPTCHA
        let correctAnswer = 0;
        function generateCaptcha() {
            const num1 = Math.floor(Math.random() * 10) + 1;
            const num2 = Math.floor(Math.random() * 10) + 1;
            correctAnswer = num1 + num2;
            document.getElementById('captchaQuestion').innerText = `What is ${num1} + ${num2}?`;
        }
        generateCaptcha();

        // 2. Handle Login Form Submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const captchaInput = parseInt(document.getElementById('captchaAnswer').value, 10);
            const errorAlert = document.getElementById('errorAlert');
            const loginBtn = document.getElementById('loginBtn');

            // Validate CAPTCHA first
            if (captchaInput !== correctAnswer) {
                errorAlert.innerText = "Incorrect CAPTCHA answer. Please try again.";
                errorAlert.classList.remove('d-none');
                generateCaptcha();
                document.getElementById('captchaAnswer').value = '';
                return;
            }

            // Show loading state
            loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Signing in...';
            loginBtn.disabled = true;
            errorAlert.classList.add('d-none');

            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    sessionStorage.setItem('ops_portal_token', data.token);
                    sessionStorage.setItem('ops_portal_user', data.username);
                    // Use replace so login page is removed from the back-button history
                    window.location.replace('/index');
                } else {
                    throw new Error(data.error || 'Login failed. Please check your credentials.');
                }
            } catch (error) {
                errorAlert.innerText = error.message;
                errorAlert.classList.remove('d-none');
                generateCaptcha();
                document.getElementById('captchaAnswer').value = '';
            } finally {
                loginBtn.innerHTML = 'Sign In <i class="bi bi-box-arrow-in-right ms-2"></i>';
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
