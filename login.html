<!doctypehtml>
    <html lang=en>
    <meta charset=UTF-8>
    <meta content="width=device-width,initial-scale=1" name=viewport>
    <title>Data Purity Tickets - Login</title>
    <link href=https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css rel=stylesheet
        crossorigin=anonymous integrity=sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN>
    <link href=https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css rel=stylesheet>
    <link href=css/style.css rel=stylesheet>

    <body class="bg-body-tertiary login-wrapper">
        <div class="end-0 m-3 position-absolute top-0"><button
                class="btn btn-outline-secondary btn-sm px-3 py-1 rounded-pill" id=themeToggle type=button
                aria-label="Toggle dark mode" title="Toggle dark mode"><i class="bi bi-moon-fill"
                    id=themeIcon></i></button></div>
        <div class=login-card>
            <div class="mb-4 text-center">
                <div class="align-items-center d-inline-flex justify-content-center mb-2 p-1 rounded"
                    style=width:48px;height:48px><img alt=Logo src=images/Picture1.png
                        style=width:48px;height:48px;object-fit:contain></div>
                <h4 class=fw-bold>Data Purity Register</h4>
                <p class="small text-muted">Sign in to access the registry
            </div>
            <div class="small alert alert-danger d-none" id=errorAlert role=alert></div>
            <form id=loginForm>
                <div class=mb-3><label class="small form-label fw-semibold" for=username>Username</label> <input
                        class="bg-body-secondary form-control" id=username required autocomplete=username></div>
                <div class=mb-3><label class="small form-label fw-semibold" for=password>Password</label> <input
                        class="bg-body-secondary form-control" id=password required autocomplete=current-password
                        type=password></div>
                <div class=mb-4><label class="small form-label fw-semibold" for=captchaAnswer>Security Check: <span
                            class="fw-bold text-primary" id=captchaQuestion></span></label> <input
                        class="bg-body-secondary form-control no-spinner" id=captchaAnswer required type=number
                        placeholder="Enter the answer"></div><button class="fw-semibold btn btn-primary py-2 w-100"
                    id=loginBtn type=submit>Sign In <i class="bi bi-box-arrow-in-right ms-2"></i></button>
            </form>
        </div>
        <script src=js/login.js></script>
