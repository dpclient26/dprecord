<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Purity Tickets - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-wrapper bg-body-tertiary">

    <!-- Theme Toggle at Top Right -->
    <div class="position-absolute top-0 end-0 m-3">
        <button id="themeToggle" class="btn btn-sm btn-outline-secondary rounded-pill px-3 py-1" type="button"
            title="Toggle dark mode" aria-label="Toggle dark mode">
            <i class="bi bi-moon-fill" id="themeIcon"></i>
        </button>
    </div>

    <div class="login-card">
        <div class="text-center mb-4">
            <div class="rounded p-1 d-inline-flex justify-content-center align-items-center mb-2"
                style="width: 48px; height: 48px;">
                <img src="images/Picture1.png" alt="Logo" style="width: 48px; height: 48px; object-fit: contain;">
            </div>
            <h4 class="fw-bold">Data Purity Register</h4>
            <p class="text-muted small">Sign in to access the registry</p>
        </div>

        <div id="errorAlert" class="alert alert-danger d-none small" role="alert"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-semibold small" for="username">Username</label>
                <input type="text" class="form-control bg-body-secondary" id="username" required
                    autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold small" for="password">Password</label>
                <input type="password" class="form-control bg-body-secondary" id="password" required
                    autocomplete="current-password">
            </div>

            <!-- Math CAPTCHA -->
            <div class="mb-4">
                <label class="form-label fw-semibold small" for="captchaAnswer">Security Check: <span
                        id="captchaQuestion" class="text-primary fw-bold"></span></label>
                <input type="number" class="form-control bg-body-secondary no-spinner" id="captchaAnswer"
                    placeholder="Enter the answer" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="loginBtn">
                Sign In <i class="bi bi-box-arrow-in-right ms-2"></i>
            </button>
        </form>
    </div>

    <script src="js/login.js"></script>
</body>

</html>
