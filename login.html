<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Purity Tickets - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { width: 100%; max-width: 400px; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); background: white; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <div class="text-white rounded p-2 d-inline-flex justify-content-center align-items-center mb-2" style="width: 50px; height: 50px;">
                <!-- <i class="bi bi-layout-text-window-reverse fs-3"></i> --> 
                 <img src="images/Picture1.png" alt="Logo" style="width: 50px; height: 50px;">
            </div>
            <h4 class="fw-bold">Data Purity Register</h4>
            <p class="text-muted small">Sign in to access the registry</p>
        </div>

        <div id="errorAlert" class="alert alert-danger d-none small" role="alert"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-semibold small">Username</label>
                <input type="text" class="form-control bg-light" id="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold small">Password</label>
                <input type="password" class="form-control bg-light" id="password" required>
            </div>
            
            <!-- Math CAPTCHA -->
            <div class="mb-4">
                <label class="form-label fw-semibold small">Security Check: <span id="captchaQuestion" class="text-primary"></span></label>
                <input type="number" class="form-control bg-light" id="captchaAnswer" placeholder="Enter the answer" required>
            </div>

            <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold" id="loginBtn">
                Sign In <i class="bi bi-box-arrow-in-right ms-2"></i>
            </button>
        </form>
    </div>

    <script> 
        // 1. Generate Math CAPTCHA
        let correctAnswer = 0;
        function generateCaptcha() {
            const num1 = Math.floor(Math.random() * 10) + 1;
            const num2 = Math.floor(Math.random() * 10) + 1;
            correctAnswer = num1 + num2;
            document.getElementById('captchaQuestion').innerText = `What is ${num1} + ${num2}?`;
        }
        generateCaptcha(); // Run on page load

        // 2. Handle Login Form Submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const captchaInput = parseInt(document.getElementById('captchaAnswer').value);
            const errorAlert = document.getElementById('errorAlert');
            const loginBtn = document.getElementById('loginBtn');

            // Validate CAPTCHA first
            if (captchaInput !== correctAnswer) {
                errorAlert.innerText = "Incorrect CAPTCHA answer. Please try again.";
                errorAlert.classList.remove('d-none');
                generateCaptcha(); // Generate new captcha
                document.getElementById('captchaAnswer').value = '';
                return;
            }

            // Show loading state
            loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Signing in...';
            loginBtn.disabled = true;
            errorAlert.classList.add('d-none');

            try {
                // Send credentials to Vercel Serverless Function
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    // Store token in SessionStorage to keep user logged in
                    sessionStorage.setItem('ops_portal_token', data.token);
                    window.location.href = '/index';
                } else {
                    throw new Error(data.error || 'Login failed');
                }
            } catch (error) {
                errorAlert.innerText = error.message;
                errorAlert.classList.remove('d-none');
                generateCaptcha();
                document.getElementById('captchaAnswer').value = '';
            } finally {
                loginBtn.innerHTML = 'Sign In <i class="bi bi-box-arrow-in-right ms-2"></i>';
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
